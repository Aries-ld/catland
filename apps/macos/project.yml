name: Catland
options:
  bundleIdPrefix: app.catland
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Catland:
    type: application
    platform: macOS
    sources:
      - path: Catland
      # 各平台官方图标（scripts/fetch_platform_icons.py 下载），按文件夹原样拷进 App
      - path: Resources/PlatformIcons
        type: folder
      # 品牌图标（scripts/make_icons.py 生成）：App 图标 + 菜单栏模板图
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Resources/MenuBarIcon.png
        buildPhase: resources
      - path: Resources/MenuBarIcon@2x.png
        buildPhase: resources
    info:
      path: Catland/Info.plist
      properties:
        CFBundleDisplayName: catland
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "7"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT · 仅供学习研究，不商用"
        NSLocationUsageDescription: "用所在城市让刘海里窗外的时间与天气和你一致。位置只留在本机，向天气服务只发送约 10km 精度的坐标。"
        NSLocationWhenInUseUsageDescription: "用所在城市让刘海里窗外的时间与天气和你一致。位置只留在本机，向天气服务只发送约 10km 精度的坐标。"
        # 开发期：sidecar 源码目录（Release 打包时改为 App 内置路径）
        CatlandSidecarDir: "$(SRCROOT)/../sidecar"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.catland.Catland
        PRODUCT_NAME: Catland
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  CatlandTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CatlandTests
    dependencies:
      - target: Catland
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Catland.app/Contents/MacOS/Catland"
schemes:
  Catland:
    build:
      targets:
        Catland: all
        CatlandTests: [test]
    test:
      targets:
        - CatlandTests
