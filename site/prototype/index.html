<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>catland · 在 Mac 刘海里，刷你常刷的 App</title>
<style>
  :root { --pink: #ff5c96; --ink: #f1f0ff; --sub: rgba(241, 240, 255, .66); }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0b0a1d; color: var(--ink); font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; }
  img, .layer { image-rendering: pixelated; }

  /* ── 首屏：三层像素视差夜景 ── */
  .hero { position: relative; height: 100vh; min-height: 680px; overflow: hidden; }
  .layer { position: absolute; inset: -4% -4% 0 -4%; background-repeat: repeat-x; background-size: auto 100%; background-position: 0 100%;
           will-change: background-position, transform; }
  .bg { background-image: url(img/background.png); animation: drift 240s linear infinite; }
  .mg { background-image: url(img/midground.png);  animation: drift 120s linear infinite; }
  .fg { background-image: url(img/foreground.png); animation: drift 60s linear infinite; }
  @keyframes drift { to { background-position-x: -1376vh; } }
  /* 暗角 + 底部渐隐到下一屏，标题区更清楚 */
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, rgba(11,10,29,.15) 0%, rgba(11,10,29,.55) 60%, rgba(11,10,29,.85) 100%),
                linear-gradient(to bottom, rgba(11,10,29,0) 70%, #0b0a1d 100%); }

  /* 屏幕顶部的刘海 + 小岛 */
  .notch { position: fixed; top: 0; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; }
  .island { width: 520px; border-radius: 0 0 22px 22px; overflow: hidden; box-shadow: 0 18px 60px rgba(120, 80, 255, .35), 0 0 0 1px rgba(255,255,255,.06);
            transition: width .45s cubic-bezier(.2,.9,.3,1.2), box-shadow .45s; }
  .island img { display: block; width: 100%; }
  .notch:hover .island { width: 600px; box-shadow: 0 24px 80px rgba(255, 92, 150, .45), 0 0 0 1px rgba(255,255,255,.1); }
  .hint { margin-top: 10px; font-size: 13px; color: #ffd27a; opacity: .9; transition: opacity .3s; }
  .notch:hover .hint { opacity: 0; }

  /* 顶栏 */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 18px 32px; }
  nav .logo { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 20px; }
  nav .logo img { height: 26px; }
  nav .links { display: flex; gap: 26px; align-items: center; font-size: 14px; color: var(--sub); }
  nav .lang { padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(10px); background: rgba(255,255,255,.06); color: var(--ink); }

  /* 标题 */
  .copy { position: absolute; z-index: 5; left: 0; right: 0; top: 33%; text-align: center; padding: 0 24px; }
  h1 { font-size: clamp(44px, 6.4vw, 92px); line-height: 1.12; letter-spacing: -.01em; font-weight: 800;
       text-shadow: 0 6px 40px rgba(0,0,0,.45); }
  h1 .hl { background: linear-gradient(90deg, #ff7ab0, #b98cff 55%, #61e3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin-top: 22px; font-size: clamp(16px, 1.5vw, 21px); color: var(--sub); }
  .lead small { display: block; margin-top: 6px; font-size: .8em; opacity: .75; }
  .cta { margin-top: 36px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 16px 28px; border-radius: 99px; font-size: 17px; font-weight: 700; text-decoration: none; transition: transform .2s, box-shadow .2s; }
  .btn.primary { background: var(--pink); color: #2a0a1a; box-shadow: 0 10px 40px rgba(255, 92, 150, .55); }
  .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 56px rgba(255, 92, 150, .7); }
  .btn.ghost { color: var(--ink); border: 1px solid rgba(255,255,255,.25); backdrop-filter: blur(12px); background: rgba(255,255,255,.07); }
  .tags { margin-top: 22px; display: flex; gap: 22px; justify-content: center; font-size: 13px; color: var(--sub); }
  .tags span::before { content: "●"; color: var(--pink); margin-right: 6px; font-size: 8px; vertical-align: 2px; }

  /* 下一屏预告：四只猫在屋顶上走 */
  .walkers { position: absolute; z-index: 6; bottom: 9%; left: 0; right: 0; height: 64px; pointer-events: none; }
  .walkers img { position: absolute; bottom: 0; height: 54px; animation: walk linear infinite; }
  @keyframes walk { from { transform: translateX(-120px); } to { transform: translateX(110vw); } }
  .scroll { position: absolute; z-index: 6; bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--sub); letter-spacing: .2em; }

  .next { min-height: 60vh; display: grid; place-items: center; color: var(--sub); font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { .layer, .walkers img { animation: none; } }
</style>
</head>
<body>
  <nav>
    <div class="logo"><img src="img/cat_ragdoll.png" alt="">catland</div>
    <div class="links"><span>功能</span><span>下载</span><span>GitHub</span><span class="lang">中文 · EN</span></div>
  </nav>

  <div class="notch">
    <div class="island"><img src="img/island.gif" alt="catland 小岛"></div>
    <div class="hint">↑ 鼠标移上来，猫会跟你打招呼</div>
  </div>

  <section class="hero" id="hero">
    <div class="layer bg" data-depth="6"></div>
    <div class="layer mg" data-depth="14"></div>
    <div class="layer fg" data-depth="28"></div>
    <div class="copy">
      <h1>在 Mac 刘海里，<br><span class="hl">刷你常刷的 App</span></h1>
      <p class="lead">小红书、抖音、B 站、快手，鼠标一推就开刷；四只猫替你把内容叼回来
        <small>Your favorite feeds, living in your MacBook notch.</small></p>
      <div class="cta">
        <a class="btn primary" href="https://github.com/Aries-ld/catland/releases/latest" id="dl">下载 macOS 版</a>
        <a class="btn ghost" href="https://github.com/Aries-ld/catland">GitHub Star</a>
      </div>
      <div class="tags"><span>免费开源</span><span>不用注册</span><span>数据只在你的 Mac 上</span></div>
    </div>
    <div class="walkers">
      <img src="img/cat_ragdoll.png"    style="animation-duration: 26s; animation-delay: -3s"  alt="">
      <img src="img/cat_tuxedoBlack.png" style="animation-duration: 31s; animation-delay: -14s" alt="">
      <img src="img/cat_calicoTV.png"   style="animation-duration: 28s; animation-delay: -21s" alt="">
      <img src="img/cat_cowJacket.png"  style="animation-duration: 34s; animation-delay: -8s"  alt="">
    </div>
    <div class="scroll">SCROLL ↓</div>
  </section>
  <section class="next">（下一屏：点一下就开刷 —— 原型只做了首屏）</section>

<script>
  // 鼠标视差：越近的层动得越多
  const layers = [...document.querySelectorAll('.layer')];
  addEventListener('mousemove', (e) => {
    const x = (e.clientX / innerWidth - .5), y = (e.clientY / innerHeight - .5);
    layers.forEach((l) => { const d = +l.dataset.depth; l.style.transform = `translate(${-x * d}px, ${-y * d * .5}px)`; });
  });
  // 往下滑：远景慢、近景快，标题淡出
  const copy = document.querySelector('.copy');
  addEventListener('scroll', () => {
    const s = scrollY;
    layers.forEach((l) => l.style.translate = `0 ${s * (+l.dataset.depth / 60)}px`);
    copy.style.opacity = Math.max(0, 1 - s / 420); copy.style.transform = `translateY(${s * .25}px)`;
  });
  // 下载按钮：读 GitHub 最新版本号
  fetch('https://api.github.com/repos/Aries-ld/catland/releases/latest').then((r) => r.json()).then((rel) => {
    const dmg = (rel.assets || []).find((a) => a.name.endsWith('.dmg'));
    const dl = document.getElementById('dl');
    if (rel.tag_name) dl.textContent = `下载 macOS 版 · ${rel.tag_name}`;
    if (dmg) dl.href = dmg.browser_download_url;
  }).catch(() => {});
</script>
</body>
</html>
